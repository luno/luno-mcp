name: Docker Publish

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up cache configuration
        id: cache
        run: |
          {
            echo "cache_from<<EOF"
            echo "type=gha"
            [ "${{ github.event_name }}" != "pull_request" ] && echo "type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache"
            echo "EOF"
            echo "cache_to<<EOF"
            echo "type=gha,mode=max"
            [ "${{ github.event_name }}" != "pull_request" ] && echo "type=registry,ref=ghcr.io/${{ github.repository }}/cache:buildcache,mode=max"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # Smoke-test the stdio handshake before pushing - the multi-arch publish
      # below would otherwise ship a container that times out under mcp-proxy.
      - name: Build image for stdio smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: luno-mcp:smoke-test
          cache-from: type=gha

      - name: Stdio handshake smoke test
        run: |
          set -euo pipefail
          req='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0.0.1"}}}'
          response=$(printf '%s\n' "$req" \
            | timeout 20 docker run --rm -i luno-mcp:smoke-test 2>/dev/null \
            | head -n 1)
          echo "Response: $response"
          echo "$response" | jq -e '.jsonrpc == "2.0" and .id == 1 and .result != null' > /dev/null

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ steps.cache.outputs.cache_from }}
          cache-to: ${{ steps.cache.outputs.cache_to }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: true
          sbom: true
